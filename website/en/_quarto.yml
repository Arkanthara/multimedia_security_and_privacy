              - ch3.qmd
              - section: "Synthesis"
                contents: ch3r.qmd
          - section: "Chapter 4: Privacy-Preserving Methods"
            contents:
              - section: "Details"
                contents: ch4c.qmd
              - ch4.qmd
              - section: "Synthesis"
                contents: ch4r.qmd

